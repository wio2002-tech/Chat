<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>코드 채팅방</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  :root { --bg:#f3f1ec; --ink:#1d2330; --sub:#6b7280; --main:#2f5d62; --me:#2f5d62; --other:#fff; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif; background:var(--bg); color:var(--ink); }
  .screen { display:none; height:100%; max-width:560px; margin:0 auto; padding:24px 16px; flex-direction:column; }
  .screen.on { display:flex; }
  h1 { font-size:28px; margin:12vh 0 24px; }
  input,button { font:inherit; padding:12px 14px; border-radius:10px; border:1px solid #cfcac0; }
  input { background:#fff; width:100%; }
  button { background:var(--main); color:#fff; border:0; cursor:pointer; }
  button.ghost { background:transparent; color:var(--main); border:1px solid var(--main); }
  .stack { display:grid; gap:10px; }
  .row { display:flex; gap:8px; }
  .row input { flex:1; }
  #code-input { text-transform:uppercase; letter-spacing:.2em; text-align:center; }
  #err { color:#b42318; min-height:1.4em; font-size:14px; }
  header { display:flex; justify-content:space-between; align-items:center; padding-bottom:12px; border-bottom:1px solid #d9d4c9; }
  header b { letter-spacing:.2em; font-size:20px; }
  header span { color:var(--sub); font-size:13px; }
  #msgs { flex:1; overflow-y:auto; padding:14px 0; display:flex; flex-direction:column; gap:8px; }
  .m { max-width:80%; padding:9px 13px; border-radius:14px; background:var(--other); word-break:break-word; }
  .m small { display:block; color:var(--sub); font-size:11px; margin-bottom:2px; }
  .m.me { align-self:flex-end; background:var(--me); color:#fff; }
  .m.me small { color:#cfe3e0; }
  button:focus-visible,input:focus-visible { outline:2px solid var(--main); outline-offset:2px; }
</style>
</head>
<body>

<!--
  준비 (Supabase SQL Editor에서 한 번 실행)

  create table rooms (code text primary key, created_at timestamptz default now());
  create table messages (
    id bigint generated always as identity primary key,
    room_code text references rooms(code),
    nickname text not null,
    content text not null check (char_length(content) <= 500),
    created_at timestamptz default now()
  );
  alter table rooms enable row level security;
  alter table messages enable row level security;
  create policy "rooms read"   on rooms    for select using (true);
  create policy "rooms add"    on rooms    for insert with check (true);
  create policy "msgs read"    on messages for select using (true);
  create policy "msgs add"     on messages for insert with check (true);
  alter publication supabase_realtime add table messages;
-->

<section id="home" class="screen on">
  <h1>코드 채팅방</h1>
  <div class="stack">
    <input id="nick" placeholder="닉네임" maxlength="12">
    <button id="make">방 만들기</button>
    <div class="row">
      <input id="code-input" placeholder="방 코드" maxlength="6">
      <button id="join" class="ghost">입장</button>
    </div>
    <div id="err"></div>
  </div>
</section>

<section id="room" class="screen">
  <header><div><b id="room-code"></b> <span>이 코드를 공유하세요</span></div><button id="leave" class="ghost">나가기</button></header>
  <div id="msgs"></div>
  <form id="form" class="row">
    <input id="text" placeholder="메시지 입력" maxlength="500" autocomplete="off">
    <button>보내기</button>
  </form>
</section>

<script>
  // 1) Supabase 프로젝트 설정 > API 에서 복사해 넣으세요 (anon 키만 사용)
  const SUPABASE_URL = "여기에_프로젝트_URL";
  const SUPABASE_ANON_KEY = "여기에_anon_키";

  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const $ = id => document.getElementById(id);
  let nick = "", code = "", channel = null;

  const show = id => { ["home","room"].forEach(s => $(s).classList.toggle("on", s === id)); };
  const err = t => { $("err").textContent = t || ""; };
  const getNick = () => {
    nick = $("nick").value.trim();
    if (!nick) { err("닉네임을 입력하세요."); return false; }
    return true;
  };
  const randomCode = () => {
    const c = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    return Array.from({length:6}, () => c[Math.floor(Math.random()*c.length)]).join("");
  };

  function addMsg(m) {
    const d = document.createElement("div");
    d.className = "m" + (m.nickname === nick ? " me" : "");
    const s = document.createElement("small"); s.textContent = m.nickname;
    d.append(s, document.createTextNode(m.content)); // textContent 방식이라 XSS 안전
    $("msgs").append(d);
    $("msgs").scrollTop = $("msgs").scrollHeight;
  }

  async function enter(c) {
    code = c; $("room-code").textContent = c; $("msgs").innerHTML = ""; show("room");
    const { data } = await db.from("messages").select("*").eq("room_code", c).order("id").limit(100);
    (data || []).forEach(addMsg);
    channel = db.channel("room-" + c)
      .on("postgres_changes", { event:"INSERT", schema:"public", table:"messages", filter:"room_code=eq." + c },
          p => addMsg(p.new))
      .subscribe();
  }

  $("make").onclick = async () => {
    if (!getNick()) return;
    const c = randomCode();
    const { error } = await db.from("rooms").insert({ code: c });
    if (error) return err("방을 만들지 못했습니다. 설정을 확인하세요.");
    err(); enter(c);
  };

  $("join").onclick = async () => {
    if (!getNick()) return;
    const c = $("code-input").value.trim().toUpperCase();
    const { data } = await db.from("rooms").select("code").eq("code", c).maybeSingle();
    if (!data) return err("없는 방 코드입니다.");
    err(); enter(c);
  };

  $("form").onsubmit = async e => {
    e.preventDefault();
    const content = $("text").value.trim();
    if (!content) return;
    $("text").value = "";
    await db.from("messages").insert({ room_code: code, nickname: nick, content });
  };

  $("leave").onclick = () => { if (channel) db.removeChannel(channel); show("home"); };
</script>
</body>
</html>
