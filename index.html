<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>코드 채팅방</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
  :root { --bg:#f3f1ec; --ink:#1d2330; --sub:#6b7280; --main:#2f5d62; --me:#2f5d62; --other:#fff; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif; background:var(--bg); color:var(--ink); }
  .screen { display:none; height:100%; max-width:560px; margin:0 auto; padding:24px 16px; flex-direction:column; }
  .screen.on { display:flex; }
  h1 { font-size:28px; margin:12vh 0 24px; }
  input,button { font:inherit; padding:12px 14px; border-radius:10px; border:1px solid #cfcac0; }
  input { background:#fff; width:100%; }
  button { background:var(--main); color:#fff; border:0; cursor:pointer; }
  button.ghost { background:transparent; color:var(--main); border:1px solid var(--main); }
  .stack { display:grid; gap:10px; }
  .row { display:flex; gap:8px; }
  .row input { flex:1; }
  #code-input { text-transform:uppercase; letter-spacing:.2em; text-align:center; }
  #err { color:#b42318; min-height:1.4em; font-size:14px; }
  header { display:flex; justify-content:space-between; align-items:center; padding-bottom:12px; border-bottom:1px solid #d9d4c9; }
  header b { letter-spacing:.2em; font-size:20px; }
  header span { color:var(--sub); font-size:13px; }
  #msgs { flex:1; overflow-y:auto; padding:14px 0; display:flex; flex-direction:column; gap:8px; }
  .m { max-width:80%; padding:9px 13px; border-radius:14px; background:var(--other); word-break:break-word; }
  .m small { display:block; color:var(--sub); font-size:11px; margin-bottom:2px; }
  .m.me { align-self:flex-end; background:var(--me); color:#fff; }
  .m.me small { color:#cfe3e0; }
  button:focus-visible,input:focus-visible { outline:2px solid var(--main); outline-offset:2px; }
  #invite { color:var(--main); font-size:14px; }
  #invite:empty { display:none; }
  .hdr-btns { display:flex; gap:6px; }
  header button { padding:8px 12px; }
  #typing { min-height:22px; font-size:13px; color:var(--sub); display:flex; align-items:center; gap:6px; padding:0 2px 6px; }
  .dots { display:inline-flex; gap:3px; }
  .dots i { width:5px; height:5px; border-radius:50%; background:var(--sub); animation:bounce 1.2s infinite ease-in-out; }
  .dots i:nth-child(2) { animation-delay:.15s; }
  .dots i:nth-child(3) { animation-delay:.3s; }
  @keyframes bounce { 0%,60%,100% { transform:translateY(0); opacity:.4; } 30% { transform:translateY(-4px); opacity:1; } }
  @media (prefers-reduced-motion:reduce) { .dots i { animation:none; } }
  #qr-modal { position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:center; justify-content:center; padding:16px; z-index:10; }
  #qr-modal.on { display:flex; }
  .qr-card { background:#fff; border-radius:16px; padding:20px; width:100%; max-width:320px; text-align:center; display:grid; gap:12px; }
  #qr-box svg { width:100%; height:auto; display:block; }
  #qr-link { font-size:12px; color:var(--sub); word-break:break-all; }
  .qr-card button { flex:1; }
  [hidden] { display:none !important; }
  button.danger { color:#b42318; border-color:#b42318; }
  .m .del { background:none; border:0; padding:4px 6px; margin-left:6px; font-size:11px; color:var(--sub); text-decoration:underline; cursor:pointer; border-radius:6px; }
  .m.me .del { color:#cfe3e0; }
  .m small .t { margin-left:6px; opacity:.85; }
  @media (max-width:420px) { header .hint { display:none; } }
  .cap { display:flex; align-items:center; justify-content:space-between; gap:10px; color:var(--sub); font-size:14px; }
  .cap input { width:90px; text-align:center; }
  .bar { padding:8px 0 0; font-size:13px; color:var(--sub); }
  .bar select { font:inherit; padding:6px 8px; margin-left:6px; border-radius:8px; border:1px solid #cfcac0; background:#fff; }
  .m .tr { margin-top:6px; padding-top:6px; border-top:1px dashed currentColor; font-size:14px; opacity:.9; }
  #toast { position:fixed; left:50%; bottom:90px; transform:translateX(-50%); background:#1d2330; color:#fff; padding:10px 16px; border-radius:999px; font-size:14px; opacity:0; pointer-events:none; transition:opacity .2s; z-index:20; }
  #toast.on { opacity:1; }
  .m a { text-decoration:underline; word-break:break-all; }
  .m:not(.me) a { color:var(--main); }
  .m.me a { color:#fff; }
  #link-modal { position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:center; justify-content:center; padding:16px; z-index:10; }
  #link-modal.on { display:flex; }
  .link-url { background:#f3f1ec; border-radius:10px; padding:10px 12px; font-size:13px; word-break:break-all; max-height:30vh; overflow:auto; }
  .trust { display:flex; align-items:center; font-size:14px; gap:8px; }
  .trust input { width:auto; padding:0; margin:0; }
  #link-modal .qr-card { text-align:left; }
</style>
</head>
<body>

<section id="home" class="screen on">
  <h1>코드 채팅방</h1>
  <div class="stack">
    <div id="invite"></div>
    <input id="nick" placeholder="닉네임" maxlength="12">
    <label id="cap-wrap" class="cap">최대 인원<input id="cap" type="number" min="2" max="50" value="2" inputmode="numeric"></label>
    <button id="make">방 만들기</button>
    <div class="row">
      <input id="code-input" placeholder="방 코드" maxlength="8">
      <button id="join" class="ghost">입장</button>
    </div>
    <div id="err"></div>
  </div>
</section>

<section id="room" class="screen">
  <header><div><b id="room-code"></b> <span id="cnt"></span> <span class="hint">이 코드를 공유하세요</span></div><div class="hdr-btns"><button id="del-room" class="ghost danger" hidden>방 삭제</button><button id="qr-btn" class="ghost">QR</button><button id="leave" class="ghost">나가기</button></div></header>
  <div class="bar"><label>번역 언어
    <select id="lang">
      <option value="ko">한국어</option><option value="en">English</option><option value="ja">日本語</option>
      <option value="zh-CN">中文</option><option value="es">Español</option><option value="fr">Français</option>
      <option value="de">Deutsch</option><option value="vi">Tiếng Việt</option><option value="th">ภาษาไทย</option>
      <option value="id">Bahasa Indonesia</option><option value="ru">Русский</option>
    </select></label></div>
  <div id="msgs"></div>
  <div id="typing" aria-live="polite"></div>
  <form id="form" class="row">
    <input id="text" placeholder="메시지 입력" maxlength="500" autocomplete="off">
    <button>보내기</button>
  </form>
</section>

<div id="link-modal">
  <div class="qr-card">
    <b>이 링크를 열까요?</b>
    <div id="link-url" class="link-url"></div>
    <label class="trust"><input type="checkbox" id="link-trust"><span>이 사이트(<b id="link-host"></b>)를 신뢰합니다</span></label>
    <div class="row"><button id="link-cancel" class="ghost">취소</button><button id="link-open">열기</button></div>
  </div>
</div>

<div id="toast"></div>

<div id="qr-modal">
  <div class="qr-card">
    <b>QR로 초대하기</b>
    <div id="qr-box"></div>
    <div id="qr-link"></div>
    <div class="row"><button id="copy" class="ghost">링크 복사</button><button id="qr-close">닫기</button></div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
  import { getDatabase, ref, set, get, push, update, query, orderByKey, limitToLast,
           onChildAdded, onChildRemoved, onValue, remove, onDisconnect, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA2GqY6Uk1zqZa5xu85Av8votsECuQVJ3I",
    authDomain: "chat-e09a9.firebaseapp.com",
    // Realtime Database 탭 상단의 주소로 바꾸세요 (지역에 따라 다를 수 있음)
    databaseURL: "https://chat-e09a9-default-rtdb.firebaseio.com",
    projectId: "chat-e09a9",
    storageBucket: "chat-e09a9.firebasestorage.app",
    messagingSenderId: "228650426201",
    appId: "1:228650426201:web:13fe5991f3dd5a83033648"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const auth = getAuth(app);
  const $ = id => document.getElementById(id);
  let uid = "", nick = "", code = "", closing = false, unsubs = [];
  let typingOn = false, typingTimer = null, memberOD = null, mySlot = "", toastTimer = null, lastCode = "";

  const show = id => { ["home","room"].forEach(s => $(s).classList.toggle("on", s === id)); };
  const err = t => { $("err").textContent = t || ""; };
  const getNick = () => {
    nick = $("nick").value.trim();
    if (!nick) { err("닉네임을 입력하세요."); return false; }
    return true;
  };
  // 8자리 코드: 추측으로 맞히기 사실상 불가능 (약 1조 가지)
  const randomCode = () => {
    const c = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    return Array.from({length:8}, () => c[Math.floor(Math.random()*c.length)]).join("");
  };
  const inviteLink = () => location.origin + location.pathname + "?room=" + code;

  function toast(t, ms = 2200) {
    const el = $("toast"); el.textContent = t; el.classList.add("on");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("on"), ms);
  }
  async function copyInvite() {
    try { await navigator.clipboard.writeText(inviteLink()); toast("초대 링크를 복사했습니다."); }
    catch { $("qr-btn").click(); }          // 복사가 막히면 QR 창에서 직접 복사
  }

  // 익명 로그인: 같은 브라우저에서는 같은 uid가 유지됩니다 (내 글/내 방 구분용)
  const ready = signInAnonymously(auth)
    .then(c => { uid = c.user.uid; })
    .catch(e => { console.error(e); err("로그인에 실패했습니다. Firebase에서 익명 로그인을 켰는지 확인하세요."); });

  function fmtTime(ts) {
    if (!ts) return "";
    const d = new Date(ts), now = new Date();
    const t = d.toLocaleTimeString("ko-KR", { hour: "numeric", minute: "2-digit" });
    if (d.toDateString() === now.toDateString()) return t;
    const date = (d.getFullYear() === now.getFullYear() ? "" : d.getFullYear() + "년 ")
               + (d.getMonth() + 1) + "월 " + d.getDate() + "일";
    return date + " " + t;
  }

  // ---- 번역 (번역 버튼을 누른 메시지만 MyMemory 무료 서비스로 전송됩니다) ----
  function detectLang(t) {
    if (/[\uAC00-\uD7AF]/.test(t)) return "ko";
    if (/[\u3040-\u30FF]/.test(t)) return "ja";
    if (/[\u4E00-\u9FFF]/.test(t)) return "zh-CN";
    if (/[\u0400-\u04FF]/.test(t)) return "ru";
    if (/[\u0E00-\u0E7F]/.test(t)) return "th";
    if (/[\u0600-\u06FF]/.test(t)) return "ar";
    return "en";
  }
  function chunk(text, max = 450) {            // API 길이 제한(약 500바이트) 때문에 나눠서 보냄
    const enc = new TextEncoder(), out = []; let cur = "";
    for (const ch of text) {
      if (enc.encode(cur + ch).length > max) { out.push(cur); cur = ""; }
      cur += ch;
    }
    if (cur) out.push(cur);
    return out;
  }
  const decode = h => { const t = document.createElement("textarea"); t.innerHTML = h; return t.value; };
  async function translate(text, tgt) {
    const src = detectLang(text);
    if (src === tgt) throw new Error("이미 같은 언어입니다.");
    const parts = [];
    for (const c of chunk(text)) {
      const r = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(c) + "&langpair=" + src + "|" + tgt);
      const j = await r.json();
      if (Number(j.responseStatus) !== 200) throw new Error(Number(j.responseStatus) === 429 ? "오늘 번역 한도를 넘었습니다." : "번역하지 못했습니다.");
      parts.push(decode(j.responseData.translatedText));
    }
    return parts.join(" ");
  }

  function addMsg(key, m) {
    const mine = m.uid === uid;
    const d = document.createElement("div");
    d.className = "m" + (mine ? " me" : "");
    d.dataset.key = key;
    const s = document.createElement("small"); s.textContent = m.nickname;
    const tm = document.createElement("span"); tm.className = "t"; tm.textContent = fmtTime(m.createdAt);
    s.append(tm);

    const tb = document.createElement("button");
    tb.type = "button"; tb.className = "del"; tb.textContent = "번역";
    let box = null;
    tb.onclick = async () => {
      const lang = $("lang").value;
      if (box && box.dataset.lang === lang) { box.remove(); box = null; return; }   // 다시 누르면 접기
      if (!box) { box = document.createElement("div"); box.className = "tr"; d.append(box); }
      box.dataset.lang = lang; box.textContent = "번역 중…";
      try { box.textContent = await translate(m.content, lang); }
      catch (e) { box.textContent = e.message || "번역하지 못했습니다."; }
    };
    s.append(tb);

    if (mine) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "del"; b.textContent = "삭제";
      b.onclick = () => {
        if (!confirm("이 메시지를 삭제할까요?")) return;
        remove(ref(db, "messages/" + code + "/" + key)).catch(e => { console.error(e); alert("삭제하지 못했습니다."); });
      };
      s.append(b);
    }
    d.append(s, renderContent(m.content)); // DOM 방식이라 XSS 안전
    $("msgs").append(d);
    $("msgs").scrollTop = $("msgs").scrollHeight;
  }

  function enter(c, slot) {
    code = c; closing = false;
    $("room-code").textContent = c; $("cnt").textContent = "";
    $("msgs").innerHTML = ""; $("typing").textContent = "";
    $("del-room").hidden = true;
    mySlot = slot;
    registerDisconnect();   // 창을 닫으면 자리가 비워짐
    show("room");
    const noop = e => {
      if (!e || !code || closing) return;
      console.error(e); toast("읽기 오류 (" + (e.code || e.message) + ")", 6000);
    };
    const q = query(ref(db, "messages/" + c), orderByKey(), limitToLast(100));
    unsubs = [
      onChildAdded(q, snap => addMsg(snap.key, snap.val()), noop),
      onChildRemoved(q, snap => {
        const el = $("msgs").querySelector('[data-key="' + snap.key + '"]');
        if (el) el.remove();
      }, noop),
      onValue(ref(db, "typing/" + c), snap => {
        const names = [];
        snap.forEach(ch => { if (ch.key !== uid) names.push(ch.val().nickname); });
        renderTyping(names);
      }, noop),
      onValue(ref(db, "rooms/" + c), snap => {
        if (!snap.exists()) {                       // 방이 삭제됨
          if (!closing) alert("방이 삭제되었습니다.");
          leaveRoom(true); return;
        }
        const r = snap.val();
        $("del-room").hidden = r.owner !== uid;     // 방장에게만 삭제 버튼 표시
        $("cnt").textContent = Object.keys(r.seats || {}).length + "/" + r.max + "명";
        ensurePresence(r);
      }, noop)
    ];
  }

  function leaveRoom(roomGone = false) {
    clearTimeout(typingTimer); setTyping(false);
    if (!roomGone && code) {
      if (memberOD) memberOD.cancel().catch(() => {});
      update(ref(db), { ["rooms/" + code + "/members/" + uid + "/" + mySlot]: null, ["rooms/" + code + "/seats/" + mySlot]: null }).catch(() => {});
    }
    memberOD = null; mySlot = "";
    unsubs.forEach(u => u()); unsubs = [];
    $("typing").textContent = ""; $("qr-modal").classList.remove("on");
    code = ""; show("home");
  }

  $("make").onclick = async () => {
    if (!getNick()) return;
    await ready; if (!uid) return;
    const max = parseInt($("cap").value, 10);
    if (!(max >= 2 && max <= 50)) return err("인원은 2~50명 사이로 입력하세요.");
    for (let i = 0; i < 3; i++) {           // 코드가 겹치면 다시 시도
      const c = randomCode();
      try {
        await set(ref(db, "rooms/" + c), { createdAt: serverTimestamp(), owner: uid, max, seats: { a: uid }, members: { [uid]: { a: true } } });
        err(); enter(c, "a"); copyInvite(); return;
      } catch (e) { console.error(e); lastCode = e.code || e.message; }
    }
    err("방을 만들지 못했습니다. 규칙/설정을 확인하세요. (" + lastCode + ")");
  };

  $("join").onclick = async () => {
    if (!getNick()) return;
    await ready; if (!uid) return;
    const c = $("code-input").value.trim().toUpperCase();
    if (!/^[A-HJ-NP-Z2-9]{6,8}$/.test(c)) return err("없는 방 코드입니다.");
    try {
      const snap = await get(ref(db, "rooms/" + c));
      if (!snap.exists()) return err("없는 방 코드입니다.");
      const r = snap.val(), seats = r.seats || {};
      if (!r.max) return err("이전 버전으로 만든 방입니다. 새로 만들어 주세요.");
      let slot = "";   // 접속(탭)마다 자리를 하나씩 차지
      for (let i = 0; !slot && i < r.max; i++) {
        const k = "a".repeat(i + 1);
        if (seats[k]) continue;
        try { await set(ref(db, "rooms/" + c + "/seats/" + k), uid); slot = k; }
        catch (e) { /* 동시에 다른 사람이 앉음 → 다음 자리 */ }
      }
      if (!slot) return err("방이 가득 찼습니다. (" + Object.keys(seats).length + "/" + r.max + "명)");
      try { await set(ref(db, "rooms/" + c + "/members/" + uid + "/" + slot), true); }
      catch (e) { remove(ref(db, "rooms/" + c + "/seats/" + slot)).catch(() => {}); throw e; }
      err(); enter(c, slot);
    } catch (e) { console.error(e); err("입장하지 못했습니다. (" + (e.code || e.message) + ")"); }
  };

  $("form").onsubmit = async e => {
    e.preventDefault();
    const content = $("text").value.trim();
    if (!content) return;
    $("text").value = "";
    clearTimeout(typingTimer); setTyping(false);
    try {
      await push(ref(db, "messages/" + code), { nickname: nick, content, uid, createdAt: serverTimestamp() });
    } catch (e) { console.error(e); toast("메시지를 보내지 못했습니다 (" + (e.code || e.message) + ")", 6000); }
  };

  $("leave").onclick = () => leaveRoom();

  // ---- 방 삭제 (방장만) ----
  $("del-room").onclick = async () => {
    if (!confirm("방을 삭제할까요? 모든 메시지가 함께 지워지고 되돌릴 수 없습니다.")) return;
    closing = true;
    const c = code;
    try {
      await update(ref(db), { ["rooms/" + c]: null, ["messages/" + c]: null, ["typing/" + c]: null });
    } catch (e) { closing = false; console.error(e); alert("방을 삭제하지 못했습니다."); }
  };

  // ---- 입력 중 표시 ----
  function setTyping(on) {
    if (!code || !uid) return;
    const r = ref(db, "typing/" + code + "/" + uid);
    if (on && !typingOn) {
      typingOn = true;
      set(r, { nickname: nick, at: serverTimestamp() }).catch(() => {});
      onDisconnect(r).remove().catch(() => {});   // 창을 닫으면 자동으로 사라짐
    } else if (!on && typingOn) {
      typingOn = false;
      remove(r).catch(() => {});
    }
  }

  function renderTyping(names) {
    const box = $("typing"); box.textContent = "";
    if (!names.length) return;
    const label = names.length <= 2 ? names.join(", ") + "님이 입력 중" : "여러 명이 입력 중";
    const dots = document.createElement("span");
    dots.className = "dots"; dots.innerHTML = "<i></i><i></i><i></i>";
    box.append(label, dots);
  }

  $("text").addEventListener("input", () => {
    clearTimeout(typingTimer);
    if ($("text").value.trim()) {
      setTyping(true);
      typingTimer = setTimeout(() => setTyping(false), 2500);
    } else setTyping(false);
  });

  // ---- QR 초대 ----
  $("qr-btn").onclick = () => {
    const link = inviteLink();
    const qr = qrcode(0, "M"); qr.addData(link); qr.make();
    $("qr-box").innerHTML = qr.createSvgTag({ scalable: true, margin: 2 });
    $("qr-link").textContent = link;
    $("copy").textContent = "링크 복사";
    $("qr-modal").classList.add("on");
  };
  $("qr-close").onclick = () => $("qr-modal").classList.remove("on");
  $("qr-modal").onclick = e => { if (e.target.id === "qr-modal") $("qr-modal").classList.remove("on"); };
  $("copy").onclick = async () => {
    try { await navigator.clipboard.writeText($("qr-link").textContent); $("copy").textContent = "복사됨"; }
    catch { $("copy").textContent = "길게 눌러 복사하세요"; }
  };

  // ---- 접속 유지: 연결이 끊겼다 돌아오면 자리를 다시 잡음 ----
  let healing = false;
  function registerDisconnect() {
    if (!code || !mySlot) return;
    memberOD = onDisconnect(ref(db, "rooms/" + code));
    memberOD.update({ ["members/" + uid + "/" + mySlot]: null, ["seats/" + mySlot]: null })
      .catch(e => console.error("onDisconnect", e));
  }
  // 연결될 때마다 (재연결 포함) 접속 해제 예약을 다시 걸어 둠
  onValue(ref(db, ".info/connected"), snap => { if (snap.val() === true) registerDisconnect(); });

  async function ensurePresence(r) {
    if (healing || !code || closing || !mySlot) return;
    const seats = r.seats || {}, mine = (r.members || {})[uid] || {};
    if (seats[mySlot] === uid && mine[mySlot] === true) return;       // 정상
    healing = true;
    try {
      let slot = seats[mySlot] === uid ? mySlot : "";
      for (let i = 0; !slot && i < r.max; i++) {
        const k = "a".repeat(i + 1);
        if (seats[k]) continue;
        try { await set(ref(db, "rooms/" + code + "/seats/" + k), uid); slot = k; } catch (e) {}
      }
      if (!slot) { alert("연결이 끊긴 사이 자리가 모두 찼습니다."); leaveRoom(true); return; }
      await set(ref(db, "rooms/" + code + "/members/" + uid + "/" + slot), true);
      mySlot = slot;
      registerDisconnect();
    } catch (e) {
      console.error(e); toast("연결을 복구하지 못했습니다 (" + (e.code || e.message) + ")", 6000);
    } finally { healing = false; }
  }

  // ---- 링크: 눌렀을 때 확인 창 ----
  const getTrusted = () => { try { return JSON.parse(localStorage.getItem("trusted") || "[]"); } catch { return []; } };
  const addTrusted = h => { try { const t = getTrusted(); if (!t.includes(h)) { t.push(h); localStorage.setItem("trusted", JSON.stringify(t)); } } catch {} };
  let pendingUrl = null;
  const closeLink = () => { $("link-modal").classList.remove("on"); pendingUrl = null; };
  const openLink = url => window.open(url, "_blank", "noopener,noreferrer");

  function askOpen(url) {
    let u; try { u = new URL(url); } catch { return; }
    if (!/^https?:$/.test(u.protocol)) return;
    if (getTrusted().includes(u.hostname)) return openLink(u.href);   // 신뢰한 사이트는 바로 열기
    pendingUrl = u;
    $("link-url").textContent = u.href;
    $("link-host").textContent = u.hostname;
    $("link-trust").checked = false;
    $("link-modal").classList.add("on");
  }
  $("link-cancel").onclick = closeLink;
  $("link-modal").onclick = e => { if (e.target.id === "link-modal") closeLink(); };
  $("link-open").onclick = () => {
    if (!pendingUrl) return;
    if ($("link-trust").checked) addTrusted(pendingUrl.hostname);
    openLink(pendingUrl.href);
    closeLink();
  };

  function renderContent(text) {
    const frag = document.createDocumentFragment();
    text.split(/(https?:\/\/[^\s<>"']+)/gi).forEach((part, i) => {
      if (i % 2 === 0) { if (part) frag.append(part); return; }       // 짝수: 일반 글, 홀수: 링크
      const m = part.match(/^(.*?)([.,!?;:)\]}]*)$/);
      const url = m[1], tail = m[2];
      let ok = false; try { ok = /^https?:$/.test(new URL(url).protocol); } catch {}
      if (!ok) { frag.append(part); return; }
      const a = document.createElement("a");
      a.href = url; a.textContent = url; a.target = "_blank"; a.rel = "noopener noreferrer";
      a.onclick = e => { e.preventDefault(); askOpen(url); };
      frag.append(a, tail);
    });
    return frag;
  }

  // ---- 번역 언어 기억 ----
  try { const l = localStorage.getItem("lang"); if (l) $("lang").value = l; } catch {}
  $("lang").onchange = () => { try { localStorage.setItem("lang", $("lang").value); } catch {} };

  // ---- QR/링크로 들어온 경우: 닉네임부터 입력 ----
  const inv = new URLSearchParams(location.search).get("room");
  const inviteCode = inv && /^[A-HJ-NP-Z2-9]{6,8}$/i.test(inv) ? inv.toUpperCase() : "";
  if (inviteCode) {
    $("code-input").value = inviteCode;
    $("invite").textContent = "초대받은 방 " + inviteCode + " · 닉네임을 입력하고 입장하세요.";
    $("make").style.display = "none";
    $("cap-wrap").style.display = "none";
    $("nick").focus();
    $("nick").addEventListener("keydown", e => { if (e.key === "Enter") $("join").click(); });
  }
</script>
</body>
</html>
